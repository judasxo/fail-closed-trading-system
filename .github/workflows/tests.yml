name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Run synthetic demo
        run: python demo.py --scenario all
      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v
